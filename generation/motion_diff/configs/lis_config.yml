title: "motion-diff@lis"
seed: 42
version: "lis_kcity_hist10_fut30"

trainer:
  accelerator: "gpu"
  devices: [0] # LIS: 보유 GPU 수에 맞게 조정 (원본은 [0,1,2,3])
  max_epochs: 200
  val_interval: 1
  ckpt_path: null # from-scratch 학습

dataset:
  name: "lis" # womd, argoverse2, lis
  data_dir: "./h5_out" # train.h5 / val.h5 위치 (lis_convert.py 의 --out-dir). generation 기준 상대경로
  batch_size:
    train: 16
    val: 16
  data_len:
    train: null
    val: null
  num_workers: 8
  pin_memory: False

model:
  target: "module_vel" # module_vel, pca, post_vel (PCA 미사용)
  # NOTE: VEL_MEAN은 model.py 상수에 직접 설정됨 (LIS 0.6448). config로 주입 안 함.
  sigma_data: 0.1
  input_dim: 2 # x, y (LIS는 z=0 평지 -> 2D)
  output_dim: 2 # consistent with target
  hidden_dim: 128
  num_historical_steps: 10 # LIS: observed 0~9 (원본 WOMD 11)
  num_future_steps: 30 # LIS: 10~39 (원본 WOMD 80); 합=40=T
  weight_decay: 0.03
  lr: 0.0005
  lr_scheduler: "OneCycleLR" # CosineAnnealingLR, OneCycleLR
  T_max: 200
  pca_path: "../../checkpoints/lcsim/lis_pca.pkl" # generation 기준 상대경로. _reconstruct_traj가 target 무관하게 PCA 스무딩 사용 -> 필수. lis_pca_gen.py로 생성(dim=60)
  map_encoder:
    num_pl_types: 20 # LIS는 코드 2,15만 사용 -> 20이면 충분
    polyline:
      hidden_dim: 64
      num_layers: 5
      num_pre_layers: 3
    num_freq_bands: 64
  agent_encoder:
    time_span: 10
    a2a_radius: 50
    pl2a_radius: 50
    num_freq_bands: 64
    num_layers: 2
    num_heads: 8
    head_dim: 16
    dropout: 0.1
  diff_decoder:
    output_head: False
    num_t2m_steps: 10 # <= num_historical_steps(10) 이어야 함
    pl2m_radius: 150
    a2m_radius: 150
    num_freq_bands: 64
    num_layers: 2
    num_recurrent_steps: 2
    num_heads: 8
    head_dim: 16
    dropout: 0.1
    pca_dim: null
